<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

<title>Помощник по учёбе</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: одна колонка как в мобильном приложении, внизу панель из 5 вкладок; формы выезжают снизу.
   Палитра: бумага с зелёным оттенком, чернила, маркер-выделитель для «завтра». */
:root{
  --bg:#F1F4EF; --surface:#FFFFFF; --surface2:#E7ECE4; --fg:#16201B; --muted:#5B685F; --line:#D6DDD2;
  --accent:#0F5B4A; --on-accent:#FFFFFF; --mark:#F4DA55; --on-mark:#16201B;
  --good:#23804D; --warn:#A96A0B; --bad:#BE3B2C;
  --f-display:'Unbounded','Onest',system-ui,sans-serif; --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#171F1B; --surface2:#212B26; --fg:#E7EEE9; --muted:#9BA9A1; --line:#2A3630;
  --accent:#6FD6B5; --on-accent:#08180F; --mark:#E2C84A; --on-mark:#16201B;
  --good:#5CC38A; --warn:#E0B050; --bad:#EF7D6E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#171F1B; --surface2:#212B26; --fg:#E7EEE9; --muted:#9BA9A1; --line:#2A3630;
  --accent:#6FD6B5; --on-accent:#08180F; --mark:#E2C84A; --on-mark:#16201B;
  --good:#5CC38A; --warn:#E0B050; --bad:#EF7D6E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--f-body);
  padding-block:8px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.cap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:8px}
.title{font:600 clamp(26px,8vw,34px)/1.05 var(--f-display);letter-spacing:-.03em;text-wrap:balance;min-width:0}
.mark{text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:5px;text-underline-offset:7px;text-decoration-skip-ink:none}
.sub{color:var(--muted);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:12px;min-width:0;border:1px solid transparent}
.wd small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wd b{font-size:16px;font-weight:600}
.wd i{width:5px;height:5px;border-radius:50%;background:transparent}
.wd.has i{background:var(--accent)}
.wd.today{border-color:var(--line)}
.wd.on{background:var(--accent);color:var(--on-accent)}
.wd.on small{color:inherit;opacity:.8}
.wd.on.has i{background:var(--on-accent)}
.weeknav{display:flex;justify-content:space-between;align-items:center}
.weeknav button{width:40px;height:32px;border-radius:10px;color:var(--muted);font-size:18px}

/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card.pad{padding:16px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.list>*+*{border-top:1px solid var(--line)}
.item{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;width:100%;text-align:left}
.item.tap:active{background:var(--surface2)}
.t{width:66px;flex:none;font:600 15px/1.3 var(--f-body);font-variant-numeric:tabular-nums}
.t small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.grow{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;flex:none}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--fg)}
.tag.bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.tag.good{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}
.tag.mk{background:var(--mark);color:var(--on-mark)}
.meta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;margin-top:4px;color:var(--muted);font-size:13px}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;background:var(--mark);color:var(--on-mark)}
.banner.plain{background:var(--surface2);color:var(--fg)}
.banner .btn{background:var(--on-mark);color:var(--mark);flex:none}
.banner.plain .btn{background:var(--accent);color:var(--on-accent)}
.quick{display:flex;gap:6px;margin-top:10px}
.quick button{min-height:36px;padding:0 12px;border-radius:10px;background:var(--surface2);font-weight:600;font-size:14px}
.quick .on{background:var(--accent);color:var(--on-accent)}

/* checkbox */
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;margin-top:1px}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk svg{width:16px;height:16px;opacity:0}
.chk.on svg{opacity:1}
.done .name{text-decoration:line-through;color:var(--muted)}

/* seg control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{min-height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg .on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* hours */
.bar{height:10px;border-radius:6px;background:var(--surface2);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.bar .d{background:var(--accent)}
.bar .p{background:color-mix(in srgb,var(--accent) 38%,var(--surface2))}
.big{font:600 28px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stats div{min-width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(--accent)}
.legend .lp::before{background:color-mix(in srgb,var(--accent) 38%,var(--surface2))}
.legend .lr::before{background:var(--surface2);border:1px solid var(--line)}

/* grades */
.avg{font:600 52px/1 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.dist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end;height:92px}
.dist div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.dist i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}
.dist b{font-size:13px}
.dist span{font-size:12px;color:var(--muted)}
.gchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gchip{min-width:34px;height:34px;padding:0 6px;border-radius:10px;font-weight:700;background:var(--surface2);display:inline-grid;place-items:center;position:relative;font-variant-numeric:tabular-nums}
.gchip sup{font-size:10px;position:absolute;top:2px;right:3px;color:var(--muted);font-weight:600}
.g5{background:color-mix(in srgb,var(--good) 22%,var(--surface))}
.g4{background:color-mix(in srgb,var(--good) 10%,var(--surface2))}
.g3{background:color-mix(in srgb,var(--warn) 20%,var(--surface))}
.g2{background:color-mix(in srgb,var(--bad) 20%,var(--surface))}
.pill{font:600 15px var(--f-body);padding:4px 10px;border-radius:10px;background:var(--surface2);font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:10px;background:var(--surface2);font-size:18px;font-weight:600}
svg text{fill:var(--muted);font:11px var(--f-body)}

/* focus */
.ring{display:grid;place-items:center;position:relative;width:min(260px,70vw);aspect-ratio:1;margin:0 auto;max-width:100%}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .time{font:600 44px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;z-index:1}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:600;border-radius:12px;min-width:0}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .on{color:var(--accent)}
nav.tabs .on span{background:var(--mark);color:var(--on-mark);padding:0 6px;border-radius:6px}
nav.tabs .badge{position:relative}
nav.tabs .badge b{position:absolute;top:-4px;right:-10px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

/* sheet */
#sheet .scrim{position:fixed;inset:0;background:rgba(8,14,11,.5);z-index:30}
#sheet .panel{position:fixed;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;z-index:31;background:var(--surface);border-radius:22px 22px 0 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-width:600px;margin:0 auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet .panel{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.panel h2{font:600 20px/1.2 var(--f-display);letter-spacing:-.02em}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.in{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px}
textarea.in{min-height:120px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick label{cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-grid;place-items:center;min-width:48px;min-height:46px;padding:0 14px;border-radius:12px;background:var(--surface2);font-weight:700;border:2px solid transparent}
.pick input:checked+span{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sw{min-width:0!important;width:38px;height:38px;padding:0!important;border-radius:50%!important}
.sw-in{box-shadow:inset 0 0 0 3px var(--surface)}
.hint{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:40;max-width:90vw;font-size:14px}

.item.wrap{flex-wrap:wrap}
.grow-row{flex-basis:100%;padding-left:78px;margin-top:-4px}
.item.win{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--muted) 9%,transparent) 8px 16px)}
.gchip.sm{min-width:30px;height:30px;font-size:14px;border-radius:8px}
.datehead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;text-align:left;padding:2px 0}
/* ---------- заставка при запуске ---------- */
#splash{position:fixed;inset:0;z-index:100;background:#0F5B4A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;animation:spOut .45s ease 1.75s forwards}
#splash svg{width:min(46vw,200px);height:auto;overflow:visible}
#splash .card{transform-origin:256px 256px;animation:spCard .6s cubic-bezier(.2,.9,.3,1.2) both}
#splash .band{transform-box:fill-box;transform-origin:50% 0;animation:spBand .45s ease .35s both}
#splash .ln{transform-box:fill-box;transform-origin:0 50%;animation:spLn .4s ease both}
#splash .l1{animation-delay:.55s}#splash .l2{animation-delay:.65s}#splash .l3{animation-delay:.9s}
#splash .dot{transform-box:fill-box;transform-origin:center;animation:spPop .35s cubic-bezier(.2,.9,.3,1.4) .8s both}
#splash .tick{stroke-dasharray:60;stroke-dashoffset:60;animation:spTick .35s ease 1.0s forwards}
#splash h1{margin:0;font:600 22px/1.2 var(--f-display);letter-spacing:-.02em;color:#F1F4EF;text-align:center;animation:spTxt .5s ease .9s both}
#splash h1 b{text-decoration:underline;text-decoration-color:#F4DA55;text-decoration-thickness:4px;text-underline-offset:6px;text-decoration-skip-ink:none;font-weight:inherit;color:#fff}
@keyframes spCard{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spBand{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes spLn{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
@keyframes spPop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes spTick{to{stroke-dashoffset:0}}
@keyframes spTxt{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{animation-delay:.3s;animation-duration:.2s}#splash *{animation:none!important}#splash .tick{stroke-dashoffset:0}}
</style>

<script>
(function(){
'use strict';
var H_PAIR=2;
var COLORS=['#3B82C4','#E07A3F','#2F9E77','#C2518F','#8A6FD1','#C9A227','#D95D5D','#4C9AA6','#7A8B3C','#B5651D'];
var WD=['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
var WDS=['пн','вт','ср','чт','пт','сб','вс'];
var MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var KINDS=['Лекция','Практика','Лабораторная','Зачёт'];

var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var pad=function(n){return String(n).padStart(2,'0')};
var ds=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var pd=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var today=function(){return ds(new Date())};
var addDays=function(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
var wdOf=function(s){return (pd(s).getDay()+6)%7};
var diffDays=function(a,b){return Math.round((pd(a)-pd(b))/864e5)};
var fmtLong=function(s){var d=pd(s);return WD[wdOf(s)]+', '+d.getDate()+' '+MON[d.getMonth()]};
var fmtShort=function(s){var d=pd(s);return d.getDate()+' '+MON[d.getMonth()].slice(0,3)};
var fmt=function(n,d){return Number(n).toFixed(d==null?2:d).replace('.',',')};
function plural(n,f){var a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return f[2];if(b>1&&b<5)return f[1];if(b===1)return f[0];return f[2]}
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1)};
function relDay(s){var d=diffDays(s,today());if(d===0)return 'Сегодня';if(d===1)return 'Завтра';if(d===2)return 'Послезавтра';if(d===-1)return 'Вчера';return cap(WD[wdOf(s)])}

/* ---------- state ---------- */
var justSeeded=false;
var SEED=['Инженерная графика','ОКЖД','Прикладная математика','Информатика','Материаловедение','Английский язык','ТБ','Физра','История','ОФГ'];
function demo(){
  var t=today(),y=function(n){return addDays(t,n)};
  var s=[
    {id:'s1',name:'Математический анализ',teacher:'',total:72,before:30,color:COLORS[0]},
    {id:'s2',name:'Физика',teacher:'',total:64,before:24,color:COLORS[1]},
    {id:'s3',name:'Программирование',teacher:'',total:90,before:36,color:COLORS[2]},
    {id:'s4',name:'История',teacher:'',total:36,before:14,color:COLORS[3]},
    {id:'s5',name:'Английский язык',teacher:'',total:54,before:20,color:COLORS[4]}];
  var L=function(sid,d,st,room,kind,status){return {id:uid(),sid:sid,date:d,start:st,room:room,kind:kind,status:status||'planned'}};
  return {v:1,demo:true,updated:0,subjects:s,

var cloud={ref:null,q:Promise.resolve(),timer:0};
function save(){
  state.updated=Date.now();localSave();
  if(!cloud.ref)return;
  clearTimeout(cloud.timer);
  cloud.timer=setTimeout(function(){
    var snap=JSON.parse(JSON.stringify(state));
    cloud.q=cloud.q.then(function(){return cloud.ref.set({state:snap})}).catch(function(){});
  },500);
}

async function initCloud(){
  try{
    var c=window.claude;if(!c||!c.use)return;
    var res=await Promise.all([c.use('db'),c.use('user')]);
    var db=res[0],user=res[1];if(!db||!user)return;
    var id=await user.id();if(!id)return;
    var ref=db.doc('data/users/'+id+'/state');
    var snap=await ref.get();
    if(snap.exists){
      var r=snap.data();
      if(r&&r.state&&(r.state.updated||0)>(state.updated||0))adopt(r.state);
      else if(r&&r.state&&state.updated===0&&state.demo&&r.state.demo===false)adopt(r.state);
    }
    cloud.ref=ref;
    if(!snap.exists||state.updated>((snap.data()||{}).state||{}).updated){cloud.q=cloud.q.then(function(){return ref.set({state:JSON.parse(JSON.stringify(state))})}).catch(function(){})}
    ref.onSnapshot(function(s){
      if(!s.exists||s.metadata.hasPendingWrites)return;
      var r=s.data();
      if(r&&r.state&&(r.state.updated||0)>(state.updated||0))adopt(r.state);
    },function(){});
  }catch(e){}
}

function lessonKey(l){return (l.num===''||l.num==null)?null:+l.num}
function sortLessons(a,b){
  var na=lessonKey(a),nb=lessonKey(b);
  if(na!=null&&nb!=null&&na!==nb)return na-nb;
  if(a.start&&b.start&&a.start!==b.start)return a.start<b.start?-1:1;
  if((na!=null)!==(nb!=null))return na!=null?-1:1;
  return 0;
}
function lessonsOn(d){return state.lessons.filter(function(l){return l.date===d}).sort(sortLessons)}
function isWin(l){return l.kind==='Окно'}
function pairsOf(ls){return ls.filter(function(l){return !isWin(l)}).length}
function hoursOf(ls){return ls.filter(function(l){return !isWin(l)&&l.kind!=='Зачёт'}).length*H_PAIR}
function stats(s){
  var t=today(),done=0,planned=0,skipped=0;
  state.lessons.forEach(function(l){
    if(l.sid!==s.id||l.kind==='Зачёт')return;
    if(s.upto&&l.date<=s.upto)return;
    if(l.status==='skipped')skipped++;
    var held=l.status==='done'||l.date<t||(l.date===t&&l.status==='skipped');
    if(held)done++;else planned++;
  });
  var d=(s.before||0)+done*H_PAIR,left=Math.max(0,(s.total||0)-d);
  return {done:d,planned:planned*H_PAIR,left:left,skipped:skipped*H_PAIR,pairs:Math.ceil(left/H_PAIR)};
}
function agg(gs){var S=0,W=0;gs.forEach(function(g){S+=g.val*g.w;W+=g.w});return {S:S,W:W,n:gs.length,avg:W?S/W:null}}
function avgCls(a){return a>=4.5?'good':a>=3.5?'':a>=2.8?'warn':'bad'}
function need(a,T){
  if(!a.n)return '';
  if(a.avg>=T-1e-9)return 'Цель '+fmt(T)+' достигнута';
  if(T>=5)return 'До 5,00 уже не дотянуть';
  var n=Math.ceil((T*a.W-a.S)/(5-T)-1e-9);
  if(n>25)return 'До '+fmt(T)+' нужно больше 25 пятёрок';
  return 'До '+fmt(T)+' нужно: '+n+' × «5»';
}

function spark(gs){
  if(gs.length<3)return '';
  var sorted=gs.slice().sort(function(a,b){return a.date.localeCompare(b.date)});
  var S=0,W=0,pts=sorted.map(function(g){S+=g.val*g.w;W+=g.w;return S/W});
  var w=320,hh=110,L=26,R=10,T=10,B=10,lo=2,hi=5;
  var x=function(i){return L+(w-L-R)*(pts.length===1?0.5:i/(pts.length-1))},y=function(v){return T+(hh-T-B)*(1-(v-lo)/(hi-lo))};
  var grid=[3,4,5].map(function(v){return '<line x1="'+L+'" x2="'+(w-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="0" y="'+(y(v)+4)+'">'+v+'</text>'}).join('');
  var path=pts.map(function(v,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)}).join(' ');
  var area=path+' L'+x(pts.length-1).toFixed(1)+' '+y(lo)+' L'+x(0).toFixed(1)+' '+y(lo)+' Z';
  var last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+w+' '+hh+'" width="100%" role="img" aria-label="Динамика среднего балла" style="display:block">'+grid+'<path d="'+area+'" fill="var(--accent)" fill-opacity=".12" stroke="none"/><path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+x(pts.length-1).toFixed(1)+'" cy="'+y(last).toFixed(1)+'" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></svg>';
}

function frGs(f,m,sid){

function cmpText(me,fr,name){
  if(me==null||fr==null)return '';

function parseGr(t){
  var out=[],bad=0;
  t.split(/[\s,;]+/).forEach(function(x){
    if(!x)return;
    var m=x.match(/^([2-5])(?:[x×*х]([1-3]))?$/i);
    if(m)out.push({val:+m[1],w:+(m[2]||1)});else bad++;
  });
  return {out:out,bad:bad};
}

function fxTick(){
  if(fx.running){fx.left=fx.endAt-Date.now();if(fx.left<=0){fxFinish(true);return}}
  var t=$('#ft');if(t)t.textContent=mmss(fx.left);
  var r=$('#fring');if(r){r.setAttribute('stroke-dashoffset',String(+(2*Math.PI*54*(1-fx.left/(fx.dur*60000))).toFixed(2)))}
}

function fxFinish(full){

function matchSubject(name){
  var n=name.toLowerCase().replace(/ё/g,'е');
  var hit=state.subjects.find(function(s){var m=s.name.toLowerCase().replace(/ё/g,'е');return m===n});
  if(!hit)hit=state.subjects.find(function(s){var m=s.name.toLowerCase().replace(/ё/g,'е');return n.length>=3&&(m.indexOf(n)===0||n.indexOf(m)===0)});
  if(!hit){hit={id:uid(),name:cap(name),teacher:'',total:0,before:0,color:COLORS[state.subjects.length%COLORS.length]};state.subjects.push(hit)}
  return hit;
}
function parseLine(line){
  var s=line.replace(/^\s*(\d+[.)]|[-–—•*])\s+/,'').trim();if(!s)return null;
  var num='',nm=s.match(/(\d{1,2})\s*[-–]?\s*(?:я|й|ая)?\s*пар[аыу]?(?![а-яё])/i);
  if(nm){num=+nm[1];s=(s.slice(0,nm.index)+' '+s.slice(nm.index+nm[0].length)).trim()}
  var toks=s.split(/[\s,;]+/).filter(Boolean),o={start:'',room:'',kind:'',num:num,win:false},name=[];
  for(var i=0;i<toks.length;i++){
    var t=toks[i],lt=t.toLowerCase().replace(/\.$/,'');
    var tm=t.match(/^(\d{1,2})[:.](\d{2})$/);
    if(tm&&+tm[1]<24&&+tm[2]<60){o.start=pad(+tm[1])+':'+tm[2];continue}
    if(/^окн[оа]$/.test(lt)){o.win=true;continue}
    if(/^(лекция|лекции|лек)$/.test(lt)){o.kind='Лекция';continue}
    if(/^(практика|практическая|практ|прак|пр)$/.test(lt)){o.kind='Практика';continue}
    if(/^(лаб|лабораторная|лабка)$/.test(lt)){o.kind='Лабораторная';continue}
    if(/^(зачет|зачёт|зач)$/.test(lt)){o.kind='Зачёт';continue}
    if(/^(ауд|аудитория|каб|кабинет|к)$/.test(lt)&&toks[i+1]){o.room=toks[++i];continue}
    if(/^\d{2,4}[а-яa-z]?$/i.test(t)&&name.length){o.room=t;continue}
    if(/^[-–—]$/.test(t))continue;
    name.push(t);
  }
  o.name=name.join(' ');
  if(o.win)return o;
  return o.name?o:null;
}
